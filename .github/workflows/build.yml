name: Build installer
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Install Python packages
        run: python -m pip install -r requirements.txt
      - name: Point the updater at this repository and read the version
        shell: pwsh
        run: |
          (Get-Content version.py) -replace 'YOUR_GITHUB_USERNAME/vc-translator', $env:GITHUB_REPOSITORY | Set-Content version.py
          $v = python -c "from version import __version__ as v;print(v)"
          "APP_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build the program and the installer
        shell: cmd
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --noconsole --name VCTranslator --hidden-import pyaudiowpatch --hidden-import comtypes --collect-all customtkinter --collect-all faster_whisper --collect-all ctranslate2 --collect-all onnxruntime --collect-all av --collect-all pycaw --collect-all comtypes --collect-all proctap app.py || exit /b 1
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss || exit /b 1
      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: VC Translator ${{ env.APP_VERSION }}
          files: dist_installer/VCTranslator-Setup.exe
